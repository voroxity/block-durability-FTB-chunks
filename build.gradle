plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    runs {
        client { client() }
        server { server() }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven {
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }
    maven {
        url = 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
}

dependencies {
    compileOnly "maven.modrinth:SzzJttH8:O2Pfsh6w"

    // Optional: FTB Chunks claim integration (not bundled, only needed to compile FtbChunksCompat)
    compileOnly "dev.ftb.mods:ftb-chunks-neoforge:${ftbchunks_version}"
    compileOnly "dev.ftb.mods:ftb-teams-neoforge:${ftbteams_version}"
    compileOnly "dev.ftb.mods:ftb-library-neoforge:${ftblibrary_version}"
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}
